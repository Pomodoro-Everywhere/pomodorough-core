name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          rustup target add wasm32-unknown-unknown --toolchain 1.97.1
      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Check formatting
        run: cargo +1.97.1 fmt --all -- --check
      - name: Test all targets
        run: cargo +1.97.1 test --all-targets --locked
      - name: Lint all targets
        run: cargo +1.97.1 clippy --all-targets --locked -- -D warnings
      - name: Test WASM canonicalizer
        run: python3 -m unittest scripts/test_canonicalize_wasm_artifact.py -v
      - name: Test C5 release contract
        run: python3 -m unittest scripts/test_c5_release_contract.py -v
      - name: Test WASM discovery contract
        run: python3 -m unittest scripts/test_wasm_test_suite.py -v
      - name: Build portable WebAssembly core
        run: |
          cargo +1.97.1 build --release --target wasm32-unknown-unknown --locked
          python3 scripts/canonicalize_wasm_artifact.py target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 scripts/verify_wasm_artifact.py target/wasm32-unknown-unknown/release/pomodorough_core.wasm
      - name: Exercise exact canonical WASM
        run: |
          set -euo pipefail
          wasm=target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          python3 scripts/wasm_test_suite.py "$wasm"
      - name: Upload canonical WebAssembly core
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pomodorough-core-wasm-${{ github.sha }}
          path: target/wasm32-unknown-unknown/release/pomodorough_core.wasm
          if-no-files-found: error
          retention-days: 7
