[package]
name = "pomodorough-core"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Shared deterministic domain models and synchronization reducers for Pomodorough"
repository = "https://github.com/Pomodoro-Everywhere/pomodorough-core"

[lib]
name = "pomodorough_core"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-general-category = "1.1"
unicode-normalization = "0.1.25"
